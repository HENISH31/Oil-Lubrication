{% extends 'oil_logic/base.html' %}

{% block content %}
<section class="max-w-3xl mx-auto px-6 py-12">
    <div class="mb-10 text-center">
        <h2 class="text-xs font-black uppercase tracking-[0.4em] text-red-500 mb-2">Step 2 of 3</h2>
        <h1 class="text-5xl font-black uppercase tracking-tighter">Shipping <span class="text-red-500">Details</span></h1>
        <p class="text-gray-500 mt-4">Please provide your delivery information to proceed with the order.</p>
    </div>

    <form method="POST" action="{% url 'checkout_details' %}" class="glass-premium p-10 rounded-[3rem] space-y-6">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400">Full Name</label>
                <input type="text" name="shipping_name" required value="{{ request.session.shipping_name|default:user.get_full_name|default:'' }}"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder-white/20 focus:border-red-500 outline-none transition-all">
            </div>
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400">Mobile Number</label>
                <input type="text" name="shipping_phone" required value="{{ request.session.shipping_phone|default:user.profile.phone_number|default:'' }}"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder-white/20 focus:border-red-500 outline-none transition-all">
            </div>
        </div>

        <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-gray-400">Delivery Address</label>
            <textarea name="shipping_address" required rows="3"
                class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder-white/20 focus:border-red-500 outline-none transition-all">{{ request.session.shipping_address|default:'' }}</textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400">City</label>
                <input type="text" name="shipping_city" required value="{{ request.session.shipping_city|default:'' }}"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder-white/20 focus:border-red-500 outline-none transition-all">
            </div>
            <div class="space-y-2">
                <label class="text-[10px] font-black uppercase tracking-widest text-gray-400">Pincode</label>
                <input type="text" name="shipping_pincode" required value="{{ request.session.shipping_pincode|default:'' }}"
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white placeholder-white/20 focus:border-red-500 outline-none transition-all">
            </div>
        </div>

        <div class="pt-8 mt-8 border-t border-white/10 flex flex-col sm:flex-row gap-4 justify-between items-center">
            <a href="{% url 'cart_view' %}" class="text-[10px] font-black uppercase tracking-widest text-gray-500 hover:text-white transition-colors">
                &larr; Return to Cart
            </a>
            <button type="submit" class="btn-primary w-full sm:w-auto px-12 py-5 rounded-2xl text-[10px] font-black uppercase tracking-widest text-white shadow-2xl shadow-red-500/20 active:scale-95 transition-all">
                Continue to Payment
            </button>
        </div>
    </form>
</section>
{% endblock %}
